<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="招投标信息平台">
  <!-- 站点图标：与侧栏 .logo-mark 同款品牌蓝渐变方块 + 白色「招」 -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C52D9" />
      <stop offset="1" stop-color="#0052D9" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#brand)" />
  <text
    x="32"
    y="33"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif"
    font-size="38"
    font-weight="600"
    fill="#FFFFFF"
  >招</text>
</svg>
